<script>
  const PANEL_BUILD = "2026-11-08 21:45";

  let DATA = [];
  let META = { sources: [], builtAt: 0 };
  let loaded = false;

  /** 分类：宿主下发的 [{id,name,color,order,parentId,custom}]，这里整理成树 */
  let CATS = [];
  let MANUAL = false;
  let FOLDER_MAP = {};
  const CAT_BY_ID = new Map();
  let CAT_CHILDREN = new Map();
  const CAT_TOTAL = new Map();
  const CAT_SUBTREE = new Map();
  const catCollapsed = new Set();
  let cmAddParent = "";
  /* 左栏分类树状态：筛选词、正在新建的父级、正在重命名的分类、菜单指向的分类 */
  let railQuery = "";
  let railAdding = false;
  let railAddParent = "";
  let railEditingId = "";
  let railRenamePending = "";
  let railMenuCat = "";
  const CATEGORY_PALETTE = ["#9b8afb", "#6fbf9b", "#d8a657", "#6c9bd1", "#c98a9b", "#69b8b3", "#b08bd6", "#d08a5a", "#7f9c6a", "#8a8f98"];

  const ICONS = {
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"></path></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"></path></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>',
  };

  const state = {
    view: "index",
    category: "all",
    query: "",
    selectedId: null,
    previewId: null,
    previewSide: "right",
  };

  let folderTreeCache = null;

  const SHELF_LIMIT = 60;

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

  const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[char]));

  const escapeAttr = (value) => escapeHTML(value).replace(/`/g, "&#96;");

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch { return ""; }
  }

  function categoryMeta(id) {
    const key = String(id || "");
    const cat = CAT_BY_ID.get(key);
    if (cat) return { id: cat.id, name: cat.name, color: cat.color };
    const byName = CATS.find((c) => c.name === key);
    if (byName) return { id: byName.id, name: byName.name, color: byName.color };
    return { id: "", name: "未分类", color: "#6a7078" };
  }

  function isRecent(item) {
    if (item.added) return Date.now() - item.added <= 30 * 86400000;
    const text = String(item.time || "").trim();
    if (!text) return false;
    if (text === "今天" || text === "昨天" || text === "刚刚") return true;
    let match = text.match(/^(\d+)\s*天前$/);
    if (match) return Number(match[1]) <= 30;
    match = text.match(/^(\d+)\s*个月前$/);
    if (match) return Number(match[1]) <= 1;
    return false;
  }

  const ROOT_NAMES = ["书签栏", "其他书签", "移动设备书签"];

  function folderParts(folder) {
    return String(folder || "")
      .split(" / ")
      .map((part) => part.trim())
      .filter(Boolean)
      .filter((part) => !ROOT_NAMES.includes(part));
  }

  function normalizeItem(raw, index) {
    const url = String(raw.url || "");
    const domain = String(raw.domain || hostOf(url) || "");
    const titleText = String(raw.title || raw.shortName || "").replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u2064\uFEFF]/g, "").trim();
    const title = titleText || domain || url || "未命名收藏";
    const rawId = String(raw.categoryId || "");
    const known = CAT_BY_ID.get(rawId);
    const categoryId = known ? rawId : "";
    const category = known ? known.name : String(raw.category || raw.subLabel || "未分类");
    const catNames = new Set(CATS.map((cat) => cat.name));
    const summary = String(raw.desc || raw.summary || "");
    const folder = String(raw.folder || "");
    const parts = folderParts(folder);
    let tags = Array.isArray(raw.tags) ? raw.tags : (Array.isArray(raw.aiTakeaways) ? raw.aiTakeaways : []);
    tags = tags
      .map((tag) => String(tag).trim())
      .filter(Boolean)
      .filter((tag) => tag !== summary && tag !== title && tag !== domain)
      .filter((tag) => !catNames.has(tag));
    if (!tags.length && raw.badge && raw.badge !== domain && !String(raw.badge).includes(".")) tags = [raw.badge];
    return {
      id: String(raw.id != null ? raw.id : index + 1),
      title: title,
      url: url,
      domain: domain,
      category: category,
      categoryId: categoryId,
      summary: summary,
      folder: folder,
      folderParts: parts,
      tags: [...new Set(tags)].slice(0, 4),
      time: String(raw.time || ""),
      added: Number(raw.added || 0),
      source: String(raw.source || "Chrome"),
      inbox: Boolean(raw.inbox),
    };
  }

  function getCounts() {
    const counts = { all: DATA.length, recent: 0, [UNASSIGNED]: 0 };
    for (const item of DATA) {
      if (isRecent(item)) counts.recent += 1;
      if (!item.categoryId) counts[UNASSIGNED] += 1;
      else counts[item.categoryId] = (counts[item.categoryId] || 0) + 1;
    }
    return counts;
  }

  /* ---------- 分类模型 ---------- */

  /** 未分类在导航里的伪 id */
  const UNASSIGNED = "__unassigned__";

  function syncCategories(defs, manual, folderMap) {
    // 只认用户自己建的分类：默认 AI 分类不再出现在导航里，左栏是空模板
    const flat = (Array.isArray(defs) ? defs : [])
      .filter((raw) => raw && raw.custom !== false)
      .map((raw, index) => ({
      id: String(raw.id || `cat-${index}`),
      name: String(raw.name || "未命名分类"),
      color: String(raw.color || CATEGORY_PALETTE[index % CATEGORY_PALETTE.length]),
      order: Number.isFinite(Number(raw.order)) ? Number(raw.order) : index,
      parentId: String(raw.parentId || ""),
      custom: raw.custom !== false,
      depth: 0,
    }));
    CAT_BY_ID.clear();
    flat.forEach((cat) => CAT_BY_ID.set(cat.id, cat));
    // 父级不存在就挂回顶层，避免脏数据把节点藏起来
    flat.forEach((cat) => { if (cat.parentId && !CAT_BY_ID.has(cat.parentId)) cat.parentId = ""; });

    const children = new Map();
    for (const cat of flat) {
      const key = cat.parentId || "";
      if (!children.has(key)) children.set(key, []);
      children.get(key).push(cat);
    }
    for (const list of children.values()) {
      list.sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, "zh"));
    }

    const ordered = [];
    const seen = new Set();
    (function walk(parentId, depth) {
      for (const cat of children.get(parentId) || []) {
        if (seen.has(cat.id)) continue;
        seen.add(cat.id);
        cat.depth = depth;
        ordered.push(cat);
        walk(cat.id, depth + 1);
      }
    })("", 0);
    // 环状数据兜底：没走到的节点按顶层补上
    for (const cat of flat) {
      if (!seen.has(cat.id)) {
        cat.parentId = "";
        cat.depth = 0;
        ordered.push(cat);
      }
    }

    CATS = ordered;
    CAT_CHILDREN = children;
    MANUAL = Boolean(manual);
    FOLDER_MAP = folderMap && typeof folderMap === "object" ? folderMap : {};
  }

  function categoryChildren(id) {
    return CAT_CHILDREN.get(id) || [];
  }

  function categoryPath(cat, sep) {
    const parts = [];
    let node = cat;
    let guard = 0;
    while (node && guard < 12) {
      parts.unshift(node.name);
      node = node.parentId ? CAT_BY_ID.get(node.parentId) : null;
      guard += 1;
    }
    return parts.join(sep || " / ");
  }

  function categoryDescendants(id) {
    const out = [id];
    for (const child of categoryChildren(id)) out.push(...categoryDescendants(child.id));
    return out;
  }

  /** 父级被折叠时，子级不出现在导航里 */
  function categoryHidden(cat) {
    let parentId = cat.parentId;
    let guard = 0;
    while (parentId && guard < 12) {
      if (catCollapsed.has(parentId)) return true;
      const parent = CAT_BY_ID.get(parentId);
      parentId = parent ? parent.parentId : "";
      guard += 1;
    }
    return false;
  }

  /** 每个分类的「含子分类」总数，以及子树 id 集合 */
  function computeCategoryStats() {
    const direct = new Map();
    for (const item of DATA) {
      if (item.categoryId) direct.set(item.categoryId, (direct.get(item.categoryId) || 0) + 1);
    }
    CAT_TOTAL.clear();
    CAT_SUBTREE.clear();
    for (const cat of CATS) {
      const ids = categoryDescendants(cat.id);
      CAT_SUBTREE.set(cat.id, new Set(ids));
      let total = 0;
      for (const id of ids) total += direct.get(id) || 0;
      CAT_TOTAL.set(cat.id, total);
    }
  }

  /** 文件夹 → 分类 的映射，父文件夹可继承 */
  function folderMappedId(folder) {
    const parts = String(folder || "").split(" / ").map((p) => p.trim()).filter(Boolean);
    for (let i = parts.length; i > 0; i -= 1) {
      const value = FOLDER_MAP[parts.slice(0, i).join(" / ")];
      if (value && CAT_BY_ID.has(value)) return value;
    }
    return "";
  }

  /* ---------- 浏览器文件夹树（归类用） ---------- */

  function buildFolderTree() {
    if (folderTreeCache) return folderTreeCache;
    const root = { name: "", path: [], full: "", count: 0, direct: 0, children: new Map() };
    for (const item of DATA) {
      root.count += 1;
      // 用原始路径（含 书签栏 / 其他书签 根名），这样映射键和宿主完全一致
      const parts = String(item.folder || "").split(" / ").map((p) => p.trim()).filter(Boolean);
      let node = root;
      for (const part of parts) {
        let child = node.children.get(part);
        if (!child) {
          const path = node.path.concat(part);
          child = { name: part, path, full: path.join(" / "), count: 0, direct: 0, children: new Map() };
          node.children.set(part, child);
        }
        child.count += 1;
        node = child;
      }
      node.direct += 1;
    }
    folderTreeCache = root;
    return root;
  }

  function getFiltered() {
    const query = state.query.trim().toLowerCase();
    const scope = state.category !== "all" && state.category !== "recent" && state.category !== UNASSIGNED
      ? CAT_SUBTREE.get(state.category) || new Set([state.category])
      : null;
    return DATA.filter((item) => {
      if (state.category === "recent") {
        if (!isRecent(item)) return false;
      } else if (state.category === UNASSIGNED) {
        if (item.categoryId) return false;
      } else if (scope) {
        if (!item.categoryId || !scope.has(item.categoryId)) return false;
      }
      if (!query) return true;
      return [item.title, item.domain, item.summary, item.category, item.folder, ...(item.tags || [])]
        .join(" ")
        .toLowerCase()
        .includes(query);
    });
  }

  /** 分类栏溢出时底部加渐隐，提示还能往下滚。 */
  function markRailOverflow() {
    const tabs = $("#categoryTabs");
    if (tabs) tabs.classList.toggle("is-overflow", tabs.scrollHeight > tabs.clientHeight + 1);
  }

  /* ---------- 分类设计面板 ---------- */

  const CATEGORY_PALETTE_UI = ["#9b8afb", "#6fbf9b", "#d8a657", "#6c9bd1", "#c98a9b", "#69b8b3", "#b08bd6", "#d08a5a", "#7f9c6a", "#8a8f98"];
  let cmExpanded = new Set(["书签栏"]);
  let cmBusy = false;

  async function hostPost(path, body) {
    const response = await fetch(`../${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(body || {}),
    });
    if (!response.ok) throw new Error(`${path} → HTTP ${response.status}`);
    return response.json().catch(() => ({}));
  }

  async function mutate(path, body, message) {
    if (cmBusy) return false;
    cmBusy = true;
    try {
      await hostPost(path, body);
      await directFetch(true);
      if (message) showToast(message);
      return true;
    } catch (error) {
      showToast(window.parent && window.parent !== window ? `保存失败：${error.message}` : "预览模式不能保存");
      return false;
    } finally {
      cmBusy = false;
    }
  }

  function openCatManager() {
    const root = $("#catManager");
    if (!root) return;
    root.hidden = false;
    document.body.classList.add("cm-open");
    renderCatManager();
  }

  function closeCatManager() {
    const root = $("#catManager");
    if (root) root.hidden = true;
    document.body.classList.remove("cm-open");
  }

  function renderCatManager() {
    renderCmCats();
    renderCmFolders();
    const stat = $("#cmStat");
    if (stat) {
      const assigned = DATA.filter((item) => item.categoryId).length;
      stat.textContent = `${MANUAL ? "我的分类模式" : "尚未建分类"} · 已归类 ${assigned} / ${DATA.length} · 未分类 ${DATA.length - assigned}`;
    }
    const total = $("#cmCatTotal");
    if (total) total.textContent = `${CATS.length} 个`;
  }

  function renderCmCats() {
    const list = $("#cmCatList");
    if (!list) return;
    renderCmParentChip();
    if (!CATS.length) {
      list.innerHTML = '<div class="cm-empty">还没有分类。<br>在下面输入一个名字，比如「AI 工具」「影视」「服务器」，回车创建。</div>';
      return;
    }
    const visible = CATS.filter((cat) => !categoryHidden(cat));
    list.innerHTML = visible.map((cat) => {
      const kids = categoryChildren(cat.id);
      const open = kids.length > 0 && !catCollapsed.has(cat.id);
      const siblings = CAT_CHILDREN.get(cat.parentId || "") || [];
      const index = siblings.findIndex((c) => c.id === cat.id);
      return `
      <div class="cm-cat" data-id="${escapeAttr(cat.id)}" data-depth="${cat.depth}" style="padding-left:${6 + cat.depth * 14}px;--d:${cat.depth}">
        <span class="cm-caret ${kids.length ? "" : "is-leaf"} ${open ? "is-open" : ""}" ${kids.length ? 'data-cm="toggle"' : ""}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
        </span>
        <button class="cm-swatch" type="button" data-cm="color" style="--c:${escapeAttr(cat.color)}" title="点击换颜色"></button>
        <input class="cm-name" data-cm="rename" value="${escapeAttr(cat.name)}" maxlength="20" aria-label="分类名">
        <span class="cm-count" title="含子分类共 ${CAT_TOTAL.get(cat.id) || 0} 条">${CAT_TOTAL.get(cat.id) || 0}</span>
        <button class="cm-add-child" type="button" data-cm="child" title="在它下面建子分类">＋</button>
        <button class="cm-icon" type="button" data-cm="up" title="上移" ${index <= 0 ? "disabled" : ""}>↑</button>
        <button class="cm-icon" type="button" data-cm="down" title="下移" ${index === siblings.length - 1 ? "disabled" : ""}>↓</button>
        <button class="cm-icon is-danger" type="button" data-cm="del" title="删除分类">×</button>
      </div>
    `;
    }).join("");
  }

  function renderCmParentChip() {
    const chip = $("#cmParentChip");
    if (!chip) return;
    const parent = cmAddParent ? CAT_BY_ID.get(cmAddParent) : null;
    if (!parent) {
      cmAddParent = "";
      chip.hidden = true;
      chip.innerHTML = "";
      return;
    }
    chip.hidden = false;
    chip.innerHTML = `将在 <b>${escapeHTML(categoryPath(parent))}</b> 下创建<button type="button" data-cm="clear-parent" title="取消">×</button>`;
  }

  function flattenCmFolders(node, depth, rows) {
    const kids = [...node.children.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "zh"));
    for (const child of kids) {
      const hasKids = child.children.size > 0;
      const open = cmExpanded.has(child.full);
      rows.push({ node: child, depth, hasKids, open });
      if (hasKids && open) flattenCmFolders(child, depth + 1, rows);
    }
    return rows;
  }

  function renderCmFolders() {
    const list = $("#cmFolderList");
    if (!list) return;
    if (!CATS.length) {
      list.innerHTML = '<div class="cm-empty">先建至少一个分类，这里才会出现可选的归类目标。</div>';
      return;
    }
    const root = buildFolderTree();
    const rows = flattenCmFolders(root, 0, []);
    if (root.direct > 0) {
      rows.push({ node: { name: "（书签栏根目录）", full: "__root__", count: root.direct, children: new Map() }, depth: 0, hasKids: false, open: false });
    }
    list.innerHTML = rows.map(({ node, depth, hasKids, open }) => {
      const mapped = node.full === "__root__" ? "" : folderMappedId(node.full);
      const options = [`<option value="">未分类</option>`]
        .concat(CATS.map((cat) => `<option value="${escapeAttr(cat.id)}" ${cat.id === mapped ? "selected" : ""}>${escapeHTML(cat.name)}</option>`))
        .join("");
      return `
        <div class="cm-folder ${mapped ? "has-map" : ""}" data-folder="${escapeAttr(node.full)}" style="padding-left:${6 + depth * 12}px">
          <span class="cm-caret ${hasKids ? "" : "is-leaf"} ${open ? "is-open" : ""}" ${hasKids ? 'data-cm="toggle"' : ""}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
          </span>
          <span class="cm-fname" title="${escapeAttr(node.full)}">${escapeHTML(node.name)}</span>
          <span class="cm-fcount">${node.count}</span>
          <select class="cm-select" data-cm="assign" ${node.full === "__root__" ? "disabled" : ""} aria-label="归到哪个分类">${options}</select>
        </div>
      `;
    }).join("");
    const allOpen = rows.filter((row) => row.hasKids).every((row) => row.open);
    const toggle = $("#cmExpandAll");
    if (toggle) toggle.textContent = allOpen ? "全部收起" : "全部展开";
  }

  const SYS_ICONS = {
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.6 8.4 4.2-8.4 4.2L3.6 7.8z"></path><path d="m3.6 12.4 8.4 4.2 8.4-4.2"></path><path d="m3.6 16.6 8.4 4.2 8.4-4.2"></path></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"></circle><path d="M12 7.6V12l3 1.8"></path></svg>',
    hash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 4 7.6 20M16.4 4l-2 16M4.4 9h15.2M3.6 15h15.2"></path></svg>',
  };

  /** 筛选时：命中的分类 + 它们的祖先链都保留 */
  function railMatches() {
    const q = railQuery.trim().toLowerCase();
    if (!q) return null;
    const keep = new Set();
    for (const cat of CATS) {
      if (!cat.name.toLowerCase().includes(q)) continue;
      keep.add(cat.id);
      let parent = cat.parentId;
      let guard = 0;
      while (parent && guard++ < 64) {
        keep.add(parent);
        const node = CAT_BY_ID.get(parent);
        parent = node ? node.parentId : "";
      }
    }
    return keep;
  }

  function renderTabs() {
    const counts = getCounts();
    const activeId = state.category;
    const keep = railMatches();
    const rows = [
      { kind: "sys", id: "all", name: "全部收藏", icon: "layers", count: counts.all, depth: 0 },
      { kind: "sys", id: "recent", name: "最近添加", icon: "clock", count: counts.recent, depth: 0 },
    ];
    if (counts[UNASSIGNED] > 0) {
      rows.push({ kind: "sys", id: UNASSIGNED, name: "未分类", icon: "hash", count: counts[UNASSIGNED], depth: 0 });
    }
    let catCount = 0;
    for (const cat of CATS) {
      if (keep) {
        if (!keep.has(cat.id)) continue;
      } else if (categoryHidden(cat)) {
        continue;
      }
      catCount += 1;
      const kids = categoryChildren(cat.id);
      rows.push({
        kind: "cat",
        id: cat.id,
        name: cat.name,
        color: cat.color,
        count: CAT_TOTAL.get(cat.id) || 0,
        depth: cat.depth,
        hasKids: kids.length > 0,
        open: kids.length > 0 && (Boolean(keep) || !catCollapsed.has(cat.id)),
        editing: railEditingId === cat.id,
        editable: cat.custom !== false,
      });
    }
    // 正在新建时，把输入行插到「该父级的最后一个后代」后面（顶级就插在最后）
    if (railAdding) {
      const parent = railAddParent ? CAT_BY_ID.get(railAddParent) : null;
      const inputRow = { kind: "input", depth: parent ? parent.depth + 1 : 0 };
      if (parent) {
        const sub = CAT_SUBTREE.get(parent.id) || new Set([parent.id]);
        let at = -1;
        rows.forEach((row, index) => { if (row.kind === "cat" && sub.has(row.id)) at = index; });
        if (at >= 0) rows.splice(at + 1, 0, inputRow);
        else rows.push(inputRow);
      } else {
        rows.push(inputRow);
      }
    }
    const nav = $("#categoryTabs");
    const listHTML = rows.map((row) => {
      const depth = row.depth || 0;
      const indent = 10 + depth * 16;
      if (row.kind === "input") {
        return `<div class="tab tab-input" data-depth="${depth}" style="padding-left:${indent}px;--d:${depth}">
          <span class="tab-icon dot" style="--c:#c9a768"></span>
          <input class="tab-add-input" id="railAddInput" maxlength="20" placeholder="${railAddParent ? "子分类名，回车创建" : "主分类名，回车创建"}" aria-label="新分类名">
        </div>`;
      }
      const active = activeId === row.id;
      const attrs = `data-cat="${escapeAttr(row.id)}" data-depth="${depth}" title="${escapeAttr(row.name)}" style="padding-left:${indent}px;--d:${depth}"`;
      if (row.kind === "sys") {
        return `<button class="tab is-sys ${active ? "is-active" : ""}" ${attrs}>
          <span class="tab-icon">${SYS_ICONS[row.icon]}</span>
          <span class="tab-name">${escapeHTML(row.name)}</span>
          <span class="tab-count">${row.count}</span>
          <span class="tab-caret is-leaf"></span>
        </button>`;
      }
      const caret = `<span class="tab-caret ${row.hasKids ? (row.open ? "is-open" : "") : "is-leaf"}" ${row.hasKids ? 'data-toggle="1"' : ""}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
        </span>`;
      const name = row.editing
        ? `<input class="tab-rename" data-rename="${escapeAttr(row.id)}" value="${escapeAttr(row.name)}" maxlength="20" aria-label="分类名">`
        : `<span class="tab-name">${escapeHTML(row.name)}</span>`;
      const tag = row.editing ? "div" : "button";
      return `<${tag} class="tab is-cat ${row.hasKids ? "is-parent" : ""} ${active ? "is-active" : ""}" ${attrs}${row.editing ? ' role="button"' : ""}>
          <span class="tab-icon dot" style="--c:${escapeAttr(row.color)}"></span>
          ${name}
          <span class="tab-count">${row.count}</span>
          <span class="tab-act" data-act="menu" title="更多操作" aria-label="更多操作">⋯</span>
          ${caret}
        </${tag}>`;
    }).join("");
    const addRow = railAdding && !railAddParent
      ? ""
      : `<button class="tab tab-add" type="button" data-add="root" data-depth="0" style="padding-left:10px;--d:0">
          <span class="tab-plus">＋</span>
          <span class="tab-name">新建主分类</span>
        </button>`;
    const emptyHint = catCount || keep
      ? ""
      : `<div class="rail-empty">
          <b>空模板</b>
          <span>先建主分类，再在它下面建子目录。</span>
          <span>点右上角 ⋯ 可以新建子分类、改名、调顺序。</span>
        </div>`;
    nav.innerHTML = listHTML + addRow + emptyHint;
    if (railAdding) {
      const input = $("#railAddInput");
      if (input && document.activeElement !== input) input.focus();
    }
    if (railEditingId) {
      const input = nav.querySelector(`[data-rename="${railEditingId}"]`);
      if (input) {
        railRenamePending = railEditingId;
        input.focus();
        input.select();
      }
    }
    requestAnimationFrame(markRailOverflow);
  }

  function openRailAdd(parentId) {
    const parent = parentId ? CAT_BY_ID.get(parentId) : null;
    railAddParent = parent ? parent.id : "";
    railAdding = true;
    railEditingId = "";
    railQuery = "";
    const search = $("#railCatSearch");
    if (search) search.value = "";
    const clear = $("#railCatSearchClear");
    if (clear) clear.hidden = true;
    if (parent) {
      // 展开整条祖先链，保证输入行可见
      let node = parent;
      let guard = 0;
      while (node && guard++ < 64) {
        catCollapsed.delete(node.id);
        node = node.parentId ? CAT_BY_ID.get(node.parentId) : null;
      }
    }
    renderTabs();
  }

  function closeRailAdd() {
    railAdding = false;
    railAddParent = "";
    renderTabs();
  }

  async function createRailCat() {
    const input = $("#railAddInput");
    if (!input) return;
    const name = input.value.trim();
    if (!name) return;
    const parentId = railAddParent;
    const wasManual = MANUAL;
    if (parentId) catCollapsed.delete(parentId);
    const ok = await mutate(
      "category/add",
      { name, parentId },
      wasManual ? (parentId ? "子分类已创建" : "分类已创建") : "",
    );
    if (!ok) return;
    if (!wasManual) showToast("已切换到你自己的分类，AI 默认分类已收起");
    renderTabs();
  }

  function startRailRename(id) {
    const cat = CAT_BY_ID.get(id);
    if (!cat) return;
    if (cat.custom === false) {
      showToast("默认分类改不了，先建一个自己的分类");
      return;
    }
    railEditingId = id;
    renderTabs();
  }

  async function commitRailRename(id, value) {
    if (railRenamePending !== id) return;
    railRenamePending = "";
    railEditingId = "";
    const cat = CAT_BY_ID.get(id);
    const next = String(value || "").trim();
    if (!cat || !next || next === cat.name) {
      renderTabs();
      return;
    }
    await mutate("category/update", { id, name: next }, "已重命名");
  }

  function openRailMenu(anchor, id) {
    const menu = $("#railMenu");
    const cat = CAT_BY_ID.get(id);
    if (!menu || !cat) return;
    railMenuCat = id;
    const siblings = CAT_CHILDREN.get(cat.parentId || "") || [];
    const index = siblings.findIndex((c) => c.id === id);
    menu.querySelector('[data-menu="up"]').disabled = index <= 0;
    menu.querySelector('[data-menu="down"]').disabled = index === siblings.length - 1;
    menu.hidden = false;
    const rect = anchor.getBoundingClientRect();
    const width = menu.offsetWidth || 140;
    const height = menu.offsetHeight || 152;
    let left = rect.right - width;
    let top = rect.bottom + 6;
    if (top + height > window.innerHeight - 8) top = rect.top - height - 6;
    menu.style.left = `${Math.max(8, Math.min(left, window.innerWidth - width - 8))}px`;
    menu.style.top = `${Math.max(8, top)}px`;
  }

  function closeRailMenu() {
    const menu = $("#railMenu");
    if (menu) menu.hidden = true;
    railMenuCat = "";
  }

  function faviconHTML(item, className) {
    const letter = escapeHTML((item.title || item.domain || "?").trim().charAt(0).toUpperCase());
    const host = encodeURIComponent(item.domain || "");
    const src = `https://icons.duckduckgo.com/ip3/${host}.ico`;
    const fallback = `https://www.google.com/s2/favicons?domain=${host}&sz=64`;
    return `<div class="${className}"><span>${letter}</span><img src="${src}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.dataset.fb?(this.remove()):(this.dataset.fb='1',this.src='${fallback}')"></div>`;
  }

  function rowHTML(item, index) {
    const meta = categoryMeta(item.categoryId);
    const catNode = meta.id ? CAT_BY_ID.get(meta.id) : null;
    const catLabel = catNode && catNode.depth > 0 ? categoryPath(catNode, " › ") : meta.name;
    return `
      <div class="index-row ${state.selectedId === item.id ? "is-selected" : ""}" data-id="${escapeAttr(item.id)}" data-index="${index}" role="button" tabindex="0" aria-label="${escapeAttr(item.title)}">
        ${faviconHTML(item, "row-favicon")}
        <div class="row-main">
          <div class="row-title">${escapeHTML(item.title)}${item.inbox ? '<span class="inbox-dot" title="未整理"></span>' : ""}</div>
          <div class="row-domain">${escapeHTML(item.domain || item.url)}</div>
        </div>
        <div class="row-summary">${escapeHTML(item.summary || (item.folderParts.length ? item.folderParts.join(" / ") : "—"))}</div>
        <div class="row-cat" title="${escapeAttr(catLabel)}">
          <span class="cat-dot" style="background:${meta.color}"></span>
          <span class="cat-name">${escapeHTML(catLabel)}</span>
        </div>
        <div class="row-time">${escapeHTML(item.time || "—")}</div>
        <div class="row-arrow">${ICONS.arrow}</div>
      </div>
    `;
  }

  function spineHeight(item, index) {
    const seed = (String(item.title).length * 7 + index * 13 + String(item.domain).length * 3) % 46;
    return 112 + seed;
  }

  function spineWidth(item, index) {
    const seed = (String(item.title).length * 3 + String(item.domain).length * 5 + index * 7) % 3;
    return [28, 32, 37][seed];
  }

  function hexToHsl(hex) {
    const value = String(hex || "#8a8f98").replace("#", "");
    const full = value.length === 3 ? value.split("").map((c) => c + c).join("") : value;
    const num = parseInt(full, 16);
    const r = ((num >> 16) & 255) / 255;
    const g = ((num >> 8) & 255) / 255;
    const b = (num & 255) / 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const l = (max + min) / 2;
    const d = max - min;
    let h = 0;
    let s = 0;
    if (d) {
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
      else if (max === g) h = ((b - r) / d + 2) / 6;
      else h = ((r - g) / d + 4) / 6;
    }
    return [h * 360, s * 100, l * 100];
  }

  /** 同一分类里每本书做一点点色相/明度偏移，避免整排像色卡。 */
  function spineTone(hex, index) {
    const [h, s, l] = hexToHsl(hex);
    const seed = (index * 37 + 11) % 17;
    const hue = (h + (seed % 5 - 2) * 7 + 360) % 360;
    const sat = Math.max(16, Math.min(66, s + ((seed >> 2) % 3 - 1) * 7));
    const light = Math.max(26, Math.min(58, l + ((seed >> 3) % 3 - 1) * 6));
    return `hsl(${hue.toFixed(0)} ${sat.toFixed(0)}% ${light.toFixed(0)}%)`;
  }

  function spineTilt(index) {
    if (index % 19 === 5) return 1.4;
    if (index % 23 === 11) return -1.2;
    return 0;
  }

  function spineHTML(item, index) {
    const meta = categoryMeta(item.categoryId);
    const mark = String(item.domain || "").split(".")[0].slice(0, 12);
    return `
      <button class="spine ${state.selectedId === item.id ? "is-selected" : ""}" data-id="${escapeAttr(item.id)}" data-index="${index}"
        style="--h:${spineHeight(item, index)}px;--w:${spineWidth(item, index)}px;--tilt:${spineTilt(index)}deg;--tone:${spineTone(meta.color, index)}"
        title="${escapeAttr(item.title)} · ${escapeAttr(item.domain)}">
        ${index % 3 === 0 ? '<span class="spine-band"></span>' : ""}
        <span class="spine-title">${escapeHTML(item.title)}</span>
        <span class="spine-mark">${escapeHTML(mark)}</span>
      </button>
    `;
  }

  function renderIndex(items) {
    const list = $("#indexList");
    const empty = $("#emptyState");
    if (!loaded) {
      list.innerHTML = "";
      empty.classList.remove("hidden");
      empty.querySelector("strong").textContent = "正在读取书签…";
      empty.querySelector("span").textContent = "宿主注入数据后会自动出现。";
      return;
    }
    if (!items.length) {
      list.innerHTML = "";
      empty.classList.remove("hidden");
      if (!DATA.length) {
        empty.querySelector("strong").textContent = "没有读到书签";
        empty.querySelector("span").textContent = "确认 Chrome 里已有收藏，然后点右下角「刷新」重新读取。";
      } else {
        empty.querySelector("strong").textContent = "没有找到匹配的收藏";
        empty.querySelector("span").textContent = "换一个关键词，或者切换到其他分类看看。";
      }
      return;
    }
    empty.classList.add("hidden");
    list.innerHTML = items.map(rowHTML).join("");
  }

  function renderShelf(items) {
    const shelfList = $("#shelfList");
    const empty = $("#shelfEmpty");
    if (!loaded) {
      shelfList.innerHTML = "";
      empty.classList.remove("hidden");
      empty.querySelector("strong").textContent = "正在读取书签…";
      empty.querySelector("span").textContent = "宿主注入数据后会自动出现。";
      return;
    }
    const groups = CATS
      .filter((cat) => cat.depth === 0)
      .map((cat) => {
        const scope = CAT_SUBTREE.get(cat.id) || new Set([cat.id]);
        return {
          id: cat.id,
          name: cat.name,
          color: cat.color,
          items: items.filter((item) => item.categoryId && scope.has(item.categoryId)),
        };
      })
      .filter((group) => group.items.length);
    const loose = items.filter((item) => !item.categoryId);
    if (loose.length) groups.push({ id: UNASSIGNED, name: "未分类", color: "#6a7078", items: loose });
    shelfList.innerHTML = groups.map(({ id, name, color, items: group }) => {
      const visible = group.slice(0, SHELF_LIMIT);
      const rest = group.length - visible.length;
      return `
        <section class="shelf">
          <div class="shelf-head">
            <span class="shelf-dot" style="background:${color}"></span>
            <span class="shelf-title">${escapeHTML(name)}</span>
            <span class="shelf-count">${group.length}</span>
            <span class="shelf-line"></span>
            ${rest > 0 ? `<button class="shelf-more" data-more="${escapeAttr(id)}" title="在索引视图里查看「${escapeAttr(name)}」全部 ${group.length} 条">+${rest} 全部 →</button>` : ""}
          </div>
          <div class="shelf-body">
            <div class="shelf-track">
              ${visible.map(spineHTML).join("")}
            </div>
            <div class="shelf-board"></div>
          </div>
        </section>
      `;
    }).join("");
    empty.classList.toggle("hidden", groups.length > 0);
    requestAnimationFrame(updateShelfOverflow);
  }

  function updateShelfOverflow() {
    $$(".shelf-track").forEach((track) => {
      track.classList.toggle("has-overflow", track.scrollWidth > track.clientWidth + 4);
    });
  }

  function pad2(value) { return String(value).padStart(2, "0"); }

  function fmtDate(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    if (Number.isNaN(d.getTime())) return "";
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  /** 状态栏用的紧凑时间：11-08 19:52 */
  function fmtShort(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    if (Number.isNaN(d.getTime())) return "";
    return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  function fmtClock(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    if (Number.isNaN(d.getTime())) return "";
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  function sourceLabel() {
    const list = Array.isArray(META.sources) ? META.sources.filter((s) => s && s.label) : [];
    if (!list.length) return "本地书签";
    const labels = [...new Set(list.map((s) => s.label))];
    return labels.join(" + ");
  }

  /** "chrome:Default" → "Chrome"；"chrome:Profile 2" → "Chrome · Profile 2" */
  function sourceNice(raw) {
    const text = String(raw || "").trim();
    if (!text) return "本地书签";
    const [head, ...rest] = text.split(":");
    const browser = head ? head.charAt(0).toUpperCase() + head.slice(1) : "Chrome";
    const profile = rest.join(":").trim();
    if (!profile || /^default$/i.test(profile)) return browser;
    return `${browser} · ${profile}`;
  }

  function updateHeader(items) {
    const viewLabel = state.view === "index" ? "INDEX" : "SHELF";
    $("#viewEyebrow").textContent = viewLabel;
    if (!loaded) {
      $("#pageTitle").textContent = "星河书签";
      $("#pageSubtitle").textContent = "正在读取书签…";
      $("#railCount").textContent = "—";
      $("#statusLeft").textContent = "等待数据";
      $("#statusRight").innerHTML = '<span class="status-dot"></span> 正在连接浏览器书签';
      return;
    }
    const title = state.query
      ? "搜索结果"
      : state.category === "all"
        ? "全部收藏"
        : state.category === "recent"
          ? "最近添加"
          : categoryMeta(state.category).name;
    const syncedAt = META.sources && META.sources.length ? Math.max(...META.sources.map((s) => Number(s.mtime) || 0)) : 0;
    $("#pageTitle").textContent = title;
    const loose = DATA.filter((item) => !item.categoryId).length;
    const trail = MANUAL && loose > 0 && (state.category === "all" || state.category === "recent")
      ? `<span class="crumb">未分类 ${loose}</span> `
      : "";
    $("#pageSubtitle").innerHTML = `${trail}<b>${items.length}</b> 条收藏 · ${escapeHTML(sourceLabel())}${syncedAt ? ` · ${fmtClock(syncedAt)} 同步` : ""}${state.query ? ` · 关键词「${escapeHTML(state.query)}」` : ""}`;
    $("#railCount").textContent = DATA.length;
    $("#statusLeft").textContent = `${items.length} 条结果 · ${state.view === "index" ? "索引视图" : "书脊视图"}`;
    $("#statusRight").innerHTML = `<span class="status-dot"></span> <b>${escapeHTML(sourceLabel())}</b> 本地书签 · 只读${syncedAt ? ` · ${fmtShort(syncedAt)}` : ""}`;
  }

  function updateEnrichBtn() {
    const button = $("#enrichBtn");
    if (!button) return;
    const pending = loaded ? DATA.filter((item) => !item.summary).length : 0;
    button.hidden = pending === 0;
    button.textContent = `补齐 ${pending} 条简介`;
  }

  function renderView() {
    const items = getFiltered();
    updateHeader(items);
    $("#indexView").classList.toggle("hidden", state.view !== "index");
    $("#shelfView").classList.toggle("hidden", state.view !== "shelf");
    if (state.view === "index") renderIndex(items);
    else renderShelf(items);
    renderTabs();
    updateEnrichBtn();
    $$(".view-btn").forEach((button) => {
      const active = button.dataset.view === state.view;
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-selected", String(active));
    });
    return items;
  }

  function findItem(id) {
    return DATA.find((item) => String(item.id) === String(id));
  }

  function cardHTML(item) {
    const meta = categoryMeta(item.categoryId);
    const position = DATA.indexOf(item);
    const number = String(position >= 0 ? position + 1 : 0).padStart(3, "0");
    return `
      <div class="card-top">
        <span class="card-kicker">INDEX CARD · NO. ${number}</span>
        <button class="card-close" data-action="close" title="关闭">${ICONS.close}</button>
      </div>
      ${faviconHTML(item, "card-favicon")}
      <h2 class="card-title">${escapeHTML(item.title)}</h2>
      <div class="card-domain">${escapeHTML(item.domain || item.url)}</div>
      <div class="card-rule"></div>
      <p class="card-summary">${escapeHTML(item.summary || "这条收藏还没有生成简介，可以先看下面的文件夹和网址。")}</p>
      <div class="card-meta">
        <span class="meta-key">分类</span>
        <span class="meta-val">
          <select class="card-cat" id="cardCatSelect" aria-label="改分类">
            <option value="">未分类</option>
            ${CATS.map((cat) => `<option value="${escapeAttr(cat.id)}" ${cat.id === item.categoryId ? "selected" : ""}>${escapeHTML("　".repeat(cat.depth) + cat.name)}</option>`).join("")}
          </select>
        </span>
        <span class="meta-key">文件夹</span><span class="meta-val">${escapeHTML(item.folderParts.length ? item.folderParts.join(" / ") : "书签栏")}</span>
        <span class="meta-key">添加</span><span class="meta-val">${escapeHTML(fmtDate(item.added) || item.time || "—")}</span>
        <span class="meta-key">来源</span><span class="meta-val">${escapeHTML(sourceNice(item.source))}</span>
        <span class="meta-key">网址</span><span class="meta-val card-url">${escapeHTML(item.url)}</span>
      </div>
      <div class="card-tags">${(item.tags || []).map((tag) => `<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
      <div class="card-actions">
        <button class="btn btn-primary" data-action="open">打开 ${ICONS.arrow}</button>
        <button class="btn btn-ghost" data-action="copy">${ICONS.copy} 复制链接</button>
      </div>
      <div class="card-subactions">
        <button class="link-btn" data-action="session">${ICONS.chat} 发到新会话</button>
        <button class="link-btn" data-action="memory">${ICONS.pin} 记到备注</button>
      </div>
    `;
  }

  let hideTimer = null;
  let suppressPreviewUntil = 0;

  let undockTimer = null;

  function renderCard() {
    const id = state.selectedId ?? state.previewId;
    const item = id == null ? null : findItem(id);
    const panel = $("#cardPanel");
    const main = document.querySelector(".main");
    const docked = Boolean(item) && state.selectedId != null;
    if (!item) {
      panel.classList.remove("is-visible");
      clearTimeout(undockTimer);
      // 先让卡片淡出，再把右侧这一列收回去，避免卡片突然跳到屏幕右边
      undockTimer = setTimeout(() => {
        if (state.selectedId != null) return;
        panel.classList.remove("is-docked");
        if (main) main.classList.remove("has-card");
        updateShelfOverflow();
      }, 220);
      return;
    }
    clearTimeout(undockTimer);
    if (main) main.classList.toggle("has-card", docked);
    panel.classList.toggle("is-docked", docked);
    panel.classList.toggle("side-left", !docked && state.previewSide === "left");
    $("#indexCard").innerHTML = cardHTML(item);
    panel.classList.add("is-visible");
    requestAnimationFrame(updateShelfOverflow);
  }

  function showPreview(id, pointerX) {
    clearTimeout(hideTimer);
    if (Date.now() < suppressPreviewUntil) return;
    if (state.selectedId != null) return;
    const content = $("#content");
    if (content && typeof pointerX === "number") {
      const rect = content.getBoundingClientRect();
      const center = rect.left + rect.width / 2;
      const margin = 90;
      // 鼠标在哪半边，卡片就出现在另一半边；带一点迟滞，避免中线附近来回跳
      if (state.previewSide === "right" && pointerX > center + margin) state.previewSide = "left";
      else if (state.previewSide === "left" && pointerX < center - margin) state.previewSide = "right";
    }
    state.previewId = id;
    renderCard();
  }

  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (state.selectedId != null) return;
      state.previewId = null;
      renderCard();
    }, 150);
  }

  function selectItem(id) {
    state.selectedId = String(id);
    state.previewId = String(id);
    $$(".index-row, .spine").forEach((node) => {
      node.classList.toggle("is-selected", node.dataset.id === String(id));
    });
    renderCard();
  }

  function clearSelection() {
    state.selectedId = null;
    state.previewId = null;
    suppressPreviewUntil = Date.now() + 260;
    $$(".index-row, .spine").forEach((node) => node.classList.remove("is-selected"));
    renderCard();
  }

  function showToast(message) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.classList.add("is-visible");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove("is-visible"), 1600);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    showToast("链接已复制");
  }

  function openItem(item) {
    if (!item || !item.url) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ source: "bookmarks-desk", type: "open", url: item.url }, "*");
    } else {
      window.open(item.url, "_blank", "noopener,noreferrer");
    }
  }

  function bindEvents() {
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    const kbd = document.querySelector(".search kbd");
    if (kbd) kbd.textContent = isMac ? "⌘ K" : "Ctrl K";
    const hint = document.querySelector(".rail-hint");
    if (hint) hint.textContent = isMac ? "⌘K 搜索 · ESC 关闭" : "Ctrl K 搜索 · ESC 关闭";

    const refreshBtn = $("#refreshBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", () => {
        if (refreshBtn.classList.contains("is-busy")) return;
        refreshBtn.classList.add("is-busy");
        refreshBtn.textContent = "读取中";
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ source: "bookmarks-desk", type: "refresh" }, "*");
          showToast("正在重新读取浏览器书签…");
          setTimeout(() => { directFetch(); }, 1200);
        } else {
          showToast("预览模式下没有宿主可刷新");
        }
        setTimeout(() => {
          refreshBtn.classList.remove("is-busy");
          refreshBtn.textContent = "刷新";
        }, 1500);
      });
    }

    const enrichBtn = $("#enrichBtn");
    if (enrichBtn) {
      enrichBtn.addEventListener("click", () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ source: "bookmarks-desk", type: "classify" }, "*");
          showToast("已开始补齐简介，模型在后台处理，完成后会自动刷新");
          enrichBtn.hidden = true;
        } else {
          showToast("预览模式下没有模型可用");
        }
      });
    }

    $("#categoryTabs").addEventListener("click", (event) => {
      if (event.target.closest("[data-add]")) {
        openRailAdd("");
        return;
      }
      const button = event.target.closest("[data-cat]");
      if (!button) return;
      const id = button.dataset.cat;
      const act = event.target.closest("[data-act]");
      if (act) {
        event.stopPropagation();
        closeRailMenu();
        if (act.dataset.act === "menu") openRailMenu(act, id);
        return;
      }
      if (event.target.closest("[data-toggle]")) {
        if (catCollapsed.has(id)) catCollapsed.delete(id);
        else catCollapsed.add(id);
        renderTabs();
        return;
      }
      state.category = id;
      state.selectedId = null;
      state.previewId = null;
      $("#content").scrollTop = 0;
      if (railAdding) {
        railAdding = false;
        railAddParent = "";
        renderTabs();
      }
      renderView();
      renderCard();
    });

    $("#categoryTabs").addEventListener("dblclick", (event) => {
      const button = event.target.closest("[data-cat]");
      if (!button || !event.target.closest(".tab-name")) return;
      startRailRename(button.dataset.cat);
    });

    $("#categoryTabs").addEventListener("keydown", (event) => {
      const input = event.target.closest(".tab-rename, .tab-add-input");
      if (!input) return;
      event.stopPropagation();
      if (input.id === "railAddInput") {
        if (event.key === "Enter") {
          event.preventDefault();
          createRailCat();
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeRailAdd();
        }
        return;
      }
      if (event.key === "Enter") {
        event.preventDefault();
        commitRailRename(input.dataset.rename, input.value);
      } else if (event.key === "Escape") {
        event.preventDefault();
        railRenamePending = "";
        railEditingId = "";
        renderTabs();
      }
    });

    $("#categoryTabs").addEventListener("blur", (event) => {
      const input = event.target.closest?.(".tab-rename");
      if (!input) return;
      commitRailRename(input.dataset.rename, input.value);
    }, true);

    const railAddRoot = $("#railAddRoot");
    if (railAddRoot) {
      railAddRoot.addEventListener("click", () => {
        if (railAdding && !railAddParent) closeRailAdd();
        else openRailAdd("");
      });
    }

    const railSearch = $("#railCatSearch");
    if (railSearch) {
      railSearch.addEventListener("input", () => {
        railQuery = railSearch.value;
        const clear = $("#railCatSearchClear");
        if (clear) clear.hidden = !railQuery;
        renderTabs();
      });
      railSearch.addEventListener("keydown", (event) => {
        event.stopPropagation();
        if (event.key === "Escape") {
          railSearch.value = "";
          railQuery = "";
          const clear = $("#railCatSearchClear");
          if (clear) clear.hidden = true;
          renderTabs();
          railSearch.blur();
        }
      });
    }
    const railClear = $("#railCatSearchClear");
    if (railClear) {
      railClear.addEventListener("click", () => {
        if (railSearch) railSearch.value = "";
        railQuery = "";
        railClear.hidden = true;
        renderTabs();
      });
    }

    const railMenu = $("#railMenu");
    if (railMenu) {
      railMenu.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-menu]");
        if (!button || button.disabled) return;
        const kind = button.dataset.menu;
        const cat = CAT_BY_ID.get(railMenuCat);
        closeRailMenu();
        if (!cat) return;
        if (kind === "child") {
          catCollapsed.delete(cat.id);
          renderTabs();
          openRailAdd(cat.id);
          return;
        }
        if (kind === "rename") {
          startRailRename(cat.id);
          return;
        }
        if (kind === "up" || kind === "down") {
          const ids = (CAT_CHILDREN.get(cat.parentId || "") || []).map((c) => c.id);
          const index = ids.indexOf(cat.id);
          const swap = kind === "up" ? index - 1 : index + 1;
          if (index < 0 || swap < 0 || swap >= ids.length) return;
          const next = ids.slice();
          [next[index], next[swap]] = [next[swap], next[index]];
          await mutate("category/reorder", { ids: next });
          return;
        }
        if (kind === "delete") {
          const kids = Math.max(0, categoryDescendants(cat.id).length - 1);
          const ok = window.confirm(`删除「${cat.name}」${kids ? `及其中 ${kids} 个子分类` : ""}？归类到这些分类的收藏会回到「未分类」。`);
          if (ok) await mutate("category/remove", { id: cat.id }, "分类已删除");
        }
      });
    }

    document.addEventListener("click", (event) => {
      if (!railMenu || railMenu.hidden) return;
      if (event.target.closest("#railMenu") || event.target.closest('[data-act="menu"]')) return;
      closeRailMenu();
    });
    $("#categoryTabs").addEventListener("scroll", closeRailMenu);

    const cmRoot = $("#catManager");
    if (cmRoot) {
      cmRoot.addEventListener("click", (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "cm-close") closeCatManager();
      });

      $("#cmCatList").addEventListener("click", async (event) => {
        const button = event.target.closest("[data-cm]");
        if (!button) return;
        const id = button.closest("[data-id]")?.dataset.id;
        const cat = id ? CAT_BY_ID.get(id) : null;
        if (!cat) return;
        const kind = button.dataset.cm;
        if (kind === "toggle") {
          if (catCollapsed.has(id)) catCollapsed.delete(id);
          else catCollapsed.add(id);
          renderCmCats();
        } else if (kind === "color") {
          const index = CATEGORY_PALETTE.indexOf(cat.color);
          const next = CATEGORY_PALETTE[(index + 1) % CATEGORY_PALETTE.length];
          await mutate("category/update", { id, color: next });
        } else if (kind === "child") {
          cmAddParent = id;
          catCollapsed.delete(id);
          renderCmCats();
          const input = $("#cmAddInput");
          if (input) {
            input.placeholder = `在「${cat.name}」下新建子分类`;
            input.focus();
          }
        } else if (kind === "up" || kind === "down") {
          const siblings = (CAT_CHILDREN.get(cat.parentId || "") || []).slice();
          const index = siblings.findIndex((c) => c.id === id);
          const swap = kind === "up" ? index - 1 : index + 1;
          if (index < 0 || swap < 0 || swap >= siblings.length) return;
          [siblings[index], siblings[swap]] = [siblings[swap], siblings[index]];
          await mutate("category/reorder", { ids: siblings.map((c) => c.id) });
        } else if (kind === "del") {
          const kids = categoryDescendants(id).length - 1;
          const total = CAT_TOTAL.get(id) || 0;
          const extra = kids > 0 ? `\n它下面还有 ${kids} 个子分类，会一起删除。` : "";
          const ok = window.confirm(`删除分类「${cat.name}」？${extra}\n其中 ${total} 条书签会回到「未分类」，书签本身不会丢。`);
          if (!ok) return;
          await mutate("category/remove", { id }, `已删除「${cat.name}」`);
        }
      });

      $("#cmCatList").addEventListener("change", async (event) => {
        const input = event.target.closest('[data-cm="rename"]');
        if (!input) return;
        const id = input.closest("[data-id]")?.dataset.id;
        const name = input.value.trim();
        if (!id || !name) {
          renderCmCats();
          return;
        }
        await mutate("category/update", { id, name });
      });

      $("#cmCatList").addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        const input = event.target.closest('[data-cm="rename"]');
        if (!input) return;
        event.preventDefault();
        input.blur();
      });

      $("#cmAddForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = $("#cmAddInput");
        const name = input.value.trim();
        if (!name) return;
        const parentId = cmAddParent;
        const parentName = parentId ? (CAT_BY_ID.get(parentId)?.name || "") : "";
        const ok = await mutate(
          "category/add",
          { name, parentId },
          parentName ? `已在「${parentName}」下创建「${name}」` : `已创建「${name}」`,
        );
        if (ok) {
          if (parentId) catCollapsed.delete(parentId);
          input.value = "";
          cmAddParent = "";
          input.placeholder = "新分类名，回车创建";
          renderCmParentChip();
          renderCmCats();
        }
      });

      $("#cmParentChip").addEventListener("click", (event) => {
        if (!event.target.closest('[data-cm="clear-parent"]')) return;
        cmAddParent = "";
        const input = $("#cmAddInput");
        if (input) input.placeholder = "新分类名，回车创建";
        renderCmParentChip();
      });

      $("#cmExpandAll").addEventListener("click", () => {
        const root = buildFolderTree();
        const all = [];
        (function walk(node) {
          for (const child of node.children.values()) {
            all.push(child.full);
            walk(child);
          }
        })(root);
        const everyOpen = all.length > 0 && all.every((key) => cmExpanded.has(key));
        cmExpanded = new Set(everyOpen ? [] : all);
        renderCmFolders();
      });

      $("#cmFolderList").addEventListener("click", (event) => {
        const caret = event.target.closest('[data-cm="toggle"]');
        if (!caret) return;
        const folder = caret.closest("[data-folder]")?.dataset.folder;
        if (!folder) return;
        if (cmExpanded.has(folder)) cmExpanded.delete(folder);
        else cmExpanded.add(folder);
        renderCmFolders();
      });

      $("#cmFolderList").addEventListener("change", async (event) => {
        const select = event.target.closest('[data-cm="assign"]');
        if (!select) return;
        const folder = select.closest("[data-folder]")?.dataset.folder;
        if (!folder || folder === "__root__") return;
        const categoryId = select.value;
        const label = categoryId ? (CAT_BY_ID.get(categoryId)?.name || "分类") : "未分类";
        const leaf = folder.split(" / ").pop();
        await mutate("category/assign-folder", { folder, categoryId }, `「${leaf}」已归到「${label}」`);
      });
    }

    $$(".view-btn").forEach((button) => {
      button.addEventListener("click", () => {
        state.view = button.dataset.view;
        $("#content").scrollTop = 0;
        renderView();
      });
    });

    $("#searchInput").addEventListener("input", (event) => {
      state.query = event.target.value;
      state.selectedId = null;
      state.previewId = null;
      renderView();
      renderCard();
    });

    const listRoot = $("#content");
    listRoot.addEventListener("mouseover", (event) => {
      const row = event.target.closest("[data-id]");
      if (!row || !listRoot.contains(row)) return;
      if (row.contains(event.relatedTarget)) return;
      showPreview(row.dataset.id, event.clientX);
    });
    listRoot.addEventListener("mouseout", (event) => {
      const row = event.target.closest("[data-id]");
      if (!row || !listRoot.contains(row)) return;
      if (row.contains(event.relatedTarget)) return;
      scheduleHide();
    });
    listRoot.addEventListener("click", (event) => {
      const more = event.target.closest("[data-more]");
      if (more) {
        state.category = more.dataset.more;
        state.view = "index";
        state.selectedId = null;
        state.previewId = null;
        $("#content").scrollTop = 0;
        renderView();
        renderCard();
        return;
      }
      const row = event.target.closest("[data-id]");
      if (!row) return;
      selectItem(row.dataset.id);
    });
    listRoot.addEventListener("dblclick", (event) => {
      const row = event.target.closest("[data-id]");
      if (!row) return;
      const item = findItem(row.dataset.id);
      if (item) openItem(item);
    });

    $("#indexCard").addEventListener("mouseenter", () => clearTimeout(hideTimer));
    $("#indexCard").addEventListener("mouseleave", scheduleHide);
    $("#indexCard").addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;
      const item = findItem(state.selectedId ?? state.previewId);
      if (!item) return;
      if (action === "close") clearSelection();
      if (action === "open") openItem(item);
      if (action === "copy") copyText(item.url);
      if (action === "session" || action === "memory") {
        if (window.parent && window.parent !== window && typeof window.__dshAction === "function") {
          window.__dshAction(action);
        } else if (action === "session") {
          copyText(`${item.title}\n${item.url}\n${item.summary || ""}`.trim());
        } else {
          showToast("已记到本地备注");
        }
      }
    });

    $("#indexCard").addEventListener("change", async (event) => {
      const select = event.target.closest("#cardCatSelect");
      if (!select) return;
      const item = findItem(state.selectedId ?? state.previewId);
      if (!item) return;
      const categoryId = select.value;
      const label = categoryId ? (CAT_BY_ID.get(categoryId)?.name || "分类") : "未分类";
      await mutate("category/assign-item", { url: item.url, categoryId }, `已改到「${label}」`);
    });

    document.addEventListener("click", (event) => {
      if (event.target.closest("[data-id], #cardPanel, #categoryTabs, .view-switch, .search, #catManager")) return;
      if (state.selectedId != null) clearSelection();
    });

    window.addEventListener("resize", () => {
      if (state.view === "shelf") requestAnimationFrame(updateShelfOverflow);
      requestAnimationFrame(markRailOverflow);
    });

    document.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        $("#searchInput").focus();
        $("#searchInput").select();
        return;
      }
      if (event.key === "Escape") {
        const manager = $("#catManager");
        if (manager && !manager.hidden) {
          closeCatManager();
          return;
        }
        if (state.selectedId != null) clearSelection();
        else if ($("#searchInput").value) {
          $("#searchInput").value = "";
          state.query = "";
          renderView();
        } else {
          $("#searchInput").blur();
        }
        return;
      }
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        const items = getFiltered();
        if (!items.length) return;
        event.preventDefault();
        const current = items.findIndex((item) => item.id === state.selectedId);
        let next = event.key === "ArrowDown" ? current + 1 : current - 1;
        if (current < 0) next = event.key === "ArrowDown" ? 0 : items.length - 1;
        next = Math.max(0, Math.min(items.length - 1, next));
        selectItem(items[next].id);
        const node = document.querySelector(`[data-id="${items[next].id}"]`);
        if (node) node.scrollIntoView({ block: "nearest" });
        return;
      }
      if (event.key === "Enter" && state.selectedId != null) {
        const item = findItem(state.selectedId);
        if (item) openItem(item);
      }
    });
  }

  function relTime(ms) {
    if (!ms) return "";
    const diff = Date.now() - ms;
    const day = 86400000;
    if (diff < day) return "今天";
    if (diff < day * 2) return "昨天";
    if (diff < day * 30) return `${Math.floor(diff / day)} 天前`;
    if (diff < day * 365) return `${Math.floor(diff / (day * 30))} 个月前`;
    return `${Math.floor(diff / (day * 365))} 年前`;
  }

  /* 兜底：如果宿主 postMessage 没送达（比如客户端脚本版本不匹配），面板自己拉一次 /state */
  async function directFetch(force) {
    try {
      const response = await fetch(force ? "../state?refresh=1" : "../state", { cache: "no-store", credentials: "same-origin" });
      if (!response.ok) return false;
      const data = await response.json();
      const list = Array.isArray(data && data.items) ? data.items : [];
      if (!list.length) return false;
      const nameById = new Map((data.categories || []).map((c) => [c.id, c.name]));
      const items = list.map((raw, index) => ({
        id: index + 1,
        title: raw.title,
        domain: raw.host || hostOf(raw.url),
        url: raw.url,
        category: nameById.get(raw.categoryId) || "未分类",
        categoryId: raw.categoryId || "",
        folder: raw.folder || "",
        added: raw.added || 0,
        time: relTime(raw.added),
        source: raw.sourceLabel || "Chrome",
        desc: raw.summary || "",
        tags: Array.isArray(raw.tags) ? raw.tags : [],
        inbox: !raw.enriched,
      }));
      window.__applyData({
        items,
        categoryDefs: data.categories || [],
        manual: Boolean(data.manual),
        folderMap: data.folderMap || {},
        sources: data.sources || [],
        builtAt: data.builtAt || 0,
      });
      return true;
    } catch (error) {
      return false;
    }
  }

  /* 面板自己轮询宿主的面板版本：index.html 被改过后自动重载，不用手动刷 */
  let panelVersion = 0;
  async function checkPanelVersion() {
    try {
      const response = await fetch("version", { cache: "no-store" });
      if (!response.ok) return;
      const data = await response.json();
      const at = Number(data && data.at) || 0;
      if (!at) return;
      if (!panelVersion) { panelVersion = at; return; }
      if (at !== panelVersion) location.reload();
    } catch (error) {
      /* 静态预览或宿主未就绪时忽略 */
    }
  }

  function init() {
    bindEvents();
    renderView();
    const tag = $("#buildTag");
    if (tag) {
      tag.textContent = "v" + PANEL_BUILD.slice(11);
      tag.title = "面板构建时间 " + PANEL_BUILD;
    }
    checkPanelVersion();
    setInterval(checkPanelVersion, 20000);
    setTimeout(() => { if (!loaded) directFetch(); }, 2500);
    setTimeout(() => { if (!loaded) directFetch(); }, 6000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkPanelVersion();
    });
    const body = document.querySelector(".body");
    if (body) {
      body.addEventListener("transitionend", (event) => {
        if (event.propertyName.indexOf("grid-template") === 0) updateShelfOverflow();
      });
    }
  }

  window.__applyData = function (payload) {
    const rawItems = Array.isArray(payload && payload.items) ? payload.items : [];
    syncCategories(
      payload && payload.categoryDefs,
      payload && payload.manual,
      payload && payload.folderMap,
    );
    DATA = rawItems.map(normalizeItem);
    computeCategoryStats();
    folderTreeCache = null;
    META = {
      sources: payload && Array.isArray(payload.sources) ? payload.sources : [],
      builtAt: Number(payload && payload.builtAt) || 0,
    };
    const first = !loaded;
    loaded = true;
    if (first) {
      state.category = "all";
      state.query = "";
      state.selectedId = null;
      state.previewId = null;
      const input = $("#searchInput");
      if (input) input.value = "";
    } else {
      const ids = new Set(DATA.map((item) => item.id));
      if (state.selectedId != null && !ids.has(state.selectedId)) state.selectedId = null;
      if (state.previewId != null && !ids.has(state.previewId)) state.previewId = null;
      if (state.category !== "all" && state.category !== "recent" && state.category !== UNASSIGNED && !CAT_BY_ID.has(state.category)) {
        state.category = "all";
      }
    }
    renderView();
    renderCard();
    if ($("#catManager") && !$("#catManager").hidden) renderCatManager();
  };

  window.showToast = showToast;
  window.__setCurrent = function (item) {
    if (item && item.id != null) {
      state.selectedId = String(item.id);
      renderCard();
    }
  };
  window.__dshAction = function (kind) {
    const item = findItem(state.selectedId ?? state.previewId);
    if (!item) return;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: "bookmarks-desk",
        type: kind,
        item: {
          id: item.id,
          title: item.title,
          url: item.url,
          domain: item.domain,
          category: item.category,
          summary: item.summary,
          desc: item.summary,
          time: item.time,
          source: item.source,
        },
      }, "*");
    }
  };

  init();

</script>

  <script>
    (function () {
      var parentWin = window.parent !== window ? window.parent : null;
      function post(type, detail) {
        if (!parentWin) return;
        try { parentWin.postMessage(Object.assign({ source: "bookmarks-desk", type: type }, detail || {}), "*"); } catch (e) {}
      }
      window.__dshPost = post;
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.source !== "dsh-host") return;
        if (data.type === "data" && typeof window.__applyData === "function") {
          window.__dshReceived = true;
          window.__applyData(data.payload);
        }
        if (data.type === "toast" && data.message && typeof window.showToast === "function") window.showToast(data.message);
      });
      window.addEventListener("DOMContentLoaded", function () {
        var tries = 0;
        var tick = function () {
          if (window.__dshReceived) return true;
          post("ready");
          tries += 1;
          return tries > 40;
        };
        setTimeout(tick, 0);
        var timer = setInterval(function () {
          if (tick()) clearInterval(timer);
        }, 250);
      });
    })();
  </script>
