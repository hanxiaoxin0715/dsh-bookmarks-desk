<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>星河书签 · 索引与书脊</title>
<style>
  :root {
    --bg: #08090b;
    --panel: #0d0f12;
    --panel-2: #12151a;
    --line: rgba(255, 255, 255, 0.075);
    --line-strong: rgba(255, 255, 255, 0.14);
    --text: #e8e6e1;
    --muted: #8a8f98;
    --faint: #5e646d;
    --accent: #d8a657;
    --accent-soft: rgba(216, 166, 87, 0.12);
    --card: #14171c;
    --card-ink: #ecebe6;
    --card-muted: #7d848d;
    --card-line: rgba(255, 255, 255, 0.085);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --serif: Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(620px 340px at 18% -12%, rgba(216, 166, 87, 0.08), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,0.015), transparent 22%);
    z-index: 0;
  }
  button, input { font: inherit; }
  button { color: inherit; }
  ::selection { background: rgba(216, 166, 87, 0.28); }

  .app {
    position: relative;
    z-index: 1;
    height: 100dvh;
    display: grid;
    grid-template-columns: 238px minmax(0, 1fr);
  }

  /* ---------- 左侧索引栏 ---------- */
  .rail {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 20px 13px 14px;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(13,15,18,0.96), rgba(8,9,11,0.96));
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 2px 6px 18px;
    flex: 0 0 auto;
  }
  .brand-mark {
    position: relative;
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border: 1px solid rgba(216, 166, 87, 0.30);
    border-radius: 13px;
    color: var(--accent);
    background:
      radial-gradient(120% 130% at 28% 12%, rgba(216,166,87,0.20), transparent 62%),
      radial-gradient(90% 90% at 80% 96%, rgba(108,155,209,0.16), transparent 70%),
      linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.008));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.10),
      0 8px 22px -14px rgba(216,166,87,0.75);
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 13px;
    background: linear-gradient(140deg, rgba(216,166,87,0.30), transparent 45%, rgba(108,155,209,0.18));
    -webkit-mask: linear-gradient(#000, #000) content-box, linear-gradient(#000, #000);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    padding: 1px;
    pointer-events: none;
  }
  .brand-mark svg {
    width: 28px;
    height: 28px;
    display: block;
    filter: drop-shadow(0 0 6px rgba(216,166,87,0.30));
  }
  .brand-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .brand-copy strong {
    font-size: 16.5px;
    line-height: 1.1;
    letter-spacing: 0.07em;
    font-weight: 660;
    background: linear-gradient(96deg, #f3ead9 8%, #e6c78e 52%, #cfa163 92%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-copy span {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.19em;
    color: var(--faint);
    white-space: nowrap;
  }

  .rail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px 12px 8px; flex: 0 0 auto; }
  .rail-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: var(--faint);
  }
  .rail-plus {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: rgba(255,255,255,0.03);
    color: #8d939b;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .rail-plus:hover { color: var(--accent); border-color: rgba(216,166,87,0.4); background: rgba(216,166,87,0.10); }
  .rail-search {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    margin: 0 2px 12px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(255,255,255,0.028);
    flex: 0 0 auto;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .rail-search:focus-within { border-color: rgba(216,166,87,0.34); background: rgba(255,255,255,0.05); }
  .rail-search svg { width: 13px; height: 13px; flex: 0 0 auto; color: var(--faint); }
  .rail-search input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
  }
  .rail-search input::placeholder { color: #4d535b; }
  .rail-search input:focus { outline: none; }
  .rail-search-clear { border: 0; padding: 0 1px; background: transparent; color: var(--faint); font-size: 14px; line-height: 1; cursor: pointer; }
  .rail-search-clear:hover { color: var(--text); }
  /* 列表末尾的「新建主分类」幽灵行 */
  .tab-add {
    height: 34px;
    margin-top: 4px;
    border: 1px dashed rgba(255,255,255,0.10);
    color: #6a7078;
    font-family: inherit;
    font-size: 12px;
  }
  .tab-add:hover { border-color: rgba(216,166,87,0.34); background: rgba(216,166,87,0.06); color: #e2c894; }
  .tab-plus { width: 14px; flex: 0 0 auto; text-align: center; font-size: 12px; line-height: 1; }
  .tab-input {
    background: rgba(0,0,0,0.30);
    border: 1px solid rgba(216,166,87,0.30);
  }
  .tab-input .tab-icon.dot::before { background: #c9a768; }
  .tab-input input {
    flex: 1;
    min-width: 0;
    height: 22px;
    padding: 0 6px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 11.5px;
  }
  .tab-input input::placeholder { color: #565c65; }
  .tab-input input:focus { outline: none; }
  .rail-menu {
    position: fixed;
    z-index: 90;
    min-width: 138px;
    padding: 5px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 9px;
    background: rgba(18,20,24,0.98);
    box-shadow: 0 18px 40px -18px #000;
  }
  .rail-menu[hidden] { display: none; }
  .rail-menu button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: 28px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #c6cbd2;
    font-family: inherit;
    font-size: 11.5px;
    text-align: left;
    cursor: pointer;
  }
  .rail-menu button:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .rail-menu button.is-danger { color: #d98079; }
  .rail-menu button.is-danger:hover { background: rgba(224,115,108,0.14); }
  .rail-menu button:disabled { opacity: 0.3; cursor: default; background: transparent; }
  .rail-menu kbd { font-family: var(--mono); font-size: 8.5px; color: #565c65; }
  .tabs { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; scrollbar-width: none; flex: 1 1 auto; min-height: 0; padding: 2px 0 6px; }
  .tabs.is-overflow {
    -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 22px), transparent);
    mask-image: linear-gradient(180deg, #000 calc(100% - 22px), transparent);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    height: 36px;
    padding: 0 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    text-align: left;
    transition: background 0.14s ease, color 0.14s ease;
  }
  .tab:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  /* 子分类层级引导线（::before 已被选中竖条占用，这里用 ::after） */
  .tab::after {
    content: "";
    position: absolute;
    left: 17px;
    top: -3px;
    bottom: -3px;
    width: calc(var(--d, 0) * 16px);
    pointer-events: none;
    background-image: repeating-linear-gradient(to right, rgba(255,255,255,0.075) 0 1px, transparent 1px 16px);
  }
  .tab.is-active { background: rgba(255,255,255,0.062); color: var(--text); }
  .tab.is-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 2px;
    border-radius: 2px;
    background: var(--accent);
  }
  .tab-icon { width: 16px; height: 16px; flex: 0 0 auto; display: grid; place-items: center; color: #6d737c; }
  .tab-icon svg { width: 13px; height: 13px; display: block; }
  .tab-icon.dot::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c, #8a8f98); box-shadow: 0 0 0 3px rgba(255,255,255,0.035); }
  .tab.is-active .tab-icon { color: var(--accent); }
  .tab-caret { width: 16px; height: 16px; flex: 0 0 auto; display: grid; place-items: center; color: #565c65; transition: transform 0.15s ease; }
  .tab-caret.is-open { transform: rotate(90deg); }
  .tab-caret.is-leaf { visibility: hidden; }
  .tab-caret svg { width: 9px; height: 9px; display: block; }
  .tab:hover .tab-caret { color: var(--text); }
  .tab-name { min-width: 0; flex: 1; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-count { font-family: var(--mono); font-size: 10px; color: var(--faint); flex: 0 0 auto; transition: opacity 0.12s ease; }
  .tab.is-active .tab-count { color: var(--accent); }
  /* 悬停时数字让位给「⋯」 */
  .tab:hover .tab-count { opacity: 0; }
  .tab-act {
    position: absolute;
    right: 26px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    color: #7d848d;
    font-size: 12px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .tab:hover .tab-act { opacity: 1; }
  .tab-act:hover { background: rgba(255,255,255,0.11); color: var(--text); }
  .tab.is-cat .tab-name { font-weight: 560; color: #ded9d0; }
  .tab.is-cat.is-parent .tab-name { color: #eae5db; }
  .tab[data-depth="1"] .tab-name { font-size: 12px; font-weight: 400; color: #a6acb4; }
  .tab[data-depth="1"].is-active .tab-name { color: #e8e3d9; }
  .tab[data-depth="1"] .tab-icon.dot::before { width: 5px; height: 5px; border-radius: 50%; box-shadow: none; opacity: 0.85; }
  .tab:not([data-depth="0"]):not([data-depth="1"]) .tab-name { font-size: 11.5px; font-weight: 400; color: #8f959d; }
  .tab:not([data-depth="0"]) .tab-icon { width: 0; display: none; }
  .tab-rename {
    flex: 1;
    min-width: 0;
    height: 21px;
    padding: 0 6px;
    border: 1px solid rgba(216,166,87,0.45);
    border-radius: 5px;
    background: rgba(0,0,0,0.42);
    color: var(--text);
    font-family: inherit;
    font-size: 11.5px;
  }
  .tab-rename:focus { outline: none; border-color: rgba(216,166,87,0.75); }
  .rail-empty {
    margin: 16px 4px 0;
    padding: 0 6px;
    color: #4f555d;
    font-size: 10.5px;
    line-height: 1.9;
  }
  .rail-empty b { display: block; margin-bottom: 5px; color: #808790; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; }
  .rail-empty span { display: block; }

  .rail-foot { margin-top: auto; padding: 14px 8px 2px; border-top: 1px solid var(--line); }
  .rail-note { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; color: #8b929b; }
  .rail-note .pulse { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(216,166,87,0.08); }
  .rail-hint { margin-top: 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; color: #5f666e; }

  /* ---------- 分类设计面板 ---------- */
  .cm { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; }
  .cm[hidden] { display: none; }
  .cm-veil { position: absolute; inset: 0; background: rgba(3,4,6,0.72); backdrop-filter: blur(6px); animation: cm-fade 0.18s ease; }
  .cm-sheet {
    position: relative;
    width: min(860px, calc(100vw - 48px));
    height: min(760px, calc(100dvh - 56px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    background: linear-gradient(180deg, #0e1014, #0a0c0f);
    box-shadow: 0 40px 120px -40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
    animation: cm-rise 0.22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cm-fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes cm-rise { from { opacity: 0; transform: translateY(10px) scale(0.99) } to { opacity: 1; transform: none } }
  .cm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 22px 24px 16px; border-bottom: 1px solid var(--line); }
  .cm-kicker { font-family: var(--mono); font-size: 8px; letter-spacing: 0.2em; color: var(--accent); }
  .cm-head h2 { margin: 7px 0 4px; font-family: var(--serif); font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .cm-head p { margin: 0; font-size: 11px; color: var(--muted); }
  .cm-x { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
  .cm-x svg { width: 13px; height: 13px; }
  .cm-x:hover { color: var(--text); border-color: var(--line-strong); }

  .cm-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
  .cm-pane { min-height: 0; display: flex; flex-direction: column; padding: 16px 18px 12px; }
  .cm-pane.is-cats { display: none; }
  .cm-pane + .cm-pane { border-left: 1px solid var(--line); }
  .cm-pane-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 10px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--faint); }
  .cm-pane-meta { color: #4b515a; }
  .cm-mini {
    border: 0;
    background: transparent;
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--faint);
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .cm-mini:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .cm-cats, .cm-folders { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 2px; scrollbar-width: thin; scrollbar-color: #262b33 transparent; }
  .cm-cats::-webkit-scrollbar, .cm-folders::-webkit-scrollbar { width: 5px; }
  .cm-cats::-webkit-scrollbar-thumb, .cm-folders::-webkit-scrollbar-thumb { background: #262b33; border-radius: 5px; }

  .cm-cat {
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 6px;
    border-radius: 7px;
    background: rgba(255,255,255,0.022);
    border: 1px solid transparent;
  }
  /* 层级引导线：每层一条，对齐上一级箭头中心；上下各溢出 3px 把行间空隙连起来 */
  .cm-cat::before {
    content: "";
    position: absolute;
    left: 12px;
    top: -3px;
    bottom: -3px;
    width: calc(var(--d, 0) * 14px);
    pointer-events: none;
    background-image: repeating-linear-gradient(to right, rgba(255,255,255,0.085) 0 1px, transparent 1px 14px);
    background-repeat: no-repeat;
  }
  .cm-cat:hover { background-color: rgba(255,255,255,0.045); }
  /* 层级越深字号/亮度递减（对任意层数生效，不写死层级） */
  .cm-cat:not([data-depth="0"]) .cm-name { font-size: 11.5px; color: #c9ced5; }
  .cm-cat:not([data-depth="0"]):not([data-depth="1"]) .cm-name { font-size: 11px; color: #b3b9c1; }
  .cm-cat[data-depth="0"] .cm-name { font-weight: 500; }
  .cm-swatch { width: 12px; height: 12px; flex: 0 0 auto; padding: 0; border: 0; border-radius: 4px; background: var(--c, #8a8f98); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22); cursor: pointer; }
  .cm-name { flex: 1; min-width: 0; height: 24px; padding: 0 6px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--text); font-size: 12px; }
  .cm-name:hover { border-color: var(--line); }
  .cm-name:focus { outline: none; border-color: rgba(216,166,87,0.45); background: rgba(0,0,0,0.25); }
  .cm-count { font-family: var(--mono); font-size: 9px; color: var(--faint); min-width: 26px; text-align: right; }
  .cm-icon { width: 20px; height: 20px; display: grid; place-items: center; border: 0; border-radius: 4px; background: transparent; color: #565c65; font-size: 11px; cursor: pointer; }
  .cm-icon:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .cm-icon:disabled { opacity: 0.28; cursor: default; background: transparent; }
  .cm-icon.is-danger:hover { color: #e0736c; background: rgba(224,115,108,0.12); }
  .cm-cat .cm-caret { width: 13px; height: 13px; flex: 0 0 auto; display: grid; place-items: center; color: var(--faint); cursor: pointer; transition: transform 0.15s ease; }
  .cm-cat .cm-caret.is-open { transform: rotate(90deg); }
  .cm-cat .cm-caret.is-leaf { visibility: hidden; }
  .cm-cat .cm-caret svg { width: 8px; height: 8px; }
  .cm-add-child {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: transparent;
    color: #6a7078;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .cm-add-child:hover { color: var(--accent); border-color: rgba(216,166,87,0.45); background: rgba(216,166,87,0.1); }
  .cm-parent-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 4px 8px;
    border: 1px solid rgba(216,166,87,0.28);
    border-radius: 6px;
    background: rgba(216,166,87,0.08);
    font-size: 10px;
    color: #e2c894;
  }
  .cm-parent-chip[hidden] { display: none; }
  .cm-parent-chip b { font-weight: 600; }
  .cm-parent-chip button { margin-left: auto; border: 0; background: transparent; color: #8f949c; font-size: 12px; cursor: pointer; }
  .cm-parent-chip button:hover { color: var(--text); }

  .cm-add { display: flex; gap: 6px; margin-top: 10px; }
  .cm-add input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: rgba(0,0,0,0.3); color: var(--text); font-size: 12px; }
  .cm-add input:focus { outline: none; border-color: rgba(216,166,87,0.45); }
  .cm-add button { height: 32px; padding: 0 14px; border: 1px solid rgba(216,166,87,0.28); border-radius: 7px; background: rgba(216,166,87,0.12); color: #e8cf9f; font-size: 11.5px; cursor: pointer; }
  .cm-add button:hover { background: rgba(216,166,87,0.2); }

  .cm-folder { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px; border-radius: 6px; }
  .cm-folder:hover { background: rgba(255,255,255,0.035); }
  .cm-caret { width: 14px; height: 14px; flex: 0 0 auto; display: grid; place-items: center; color: var(--faint); cursor: pointer; transition: transform 0.15s ease; }
  .cm-caret.is-open { transform: rotate(90deg); }
  .cm-caret.is-leaf { visibility: hidden; }
  .cm-caret svg { width: 8px; height: 8px; }

  .cm-select { width: 108px; flex: 0 0 auto; height: 24px; padding: 0 4px; border: 1px solid var(--line); border-radius: 6px; background: #14171c; color: var(--muted); font-size: 10.5px; cursor: pointer; }
  .cm-select:focus { outline: none; border-color: rgba(216,166,87,0.45); }

  /* ---------- 主区域 ---------- */

  .body {
    position: relative;

    min-height: 0;

  }
  .main.has-card .body { grid-template-columns: minmax(0, 1fr) 384px; }
  .topbar {

  .search kbd {

  .view-switch {

  /* ---------- 索引视图 ---------- */
  .index-head, .index-row {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) 146px 88px 24px;
    align-items: center;
    column-gap: 12px;
  }
  @media (min-width: 1180px) {
    .index-head, .index-row {

    }
    .index-head span.h-summary { display: block; }
    .index-row .row-summary { display: block; }

  .index-head {

    border-bottom: 1px solid var(--line);

  .row-main { min-width: 0; }
  .row-title {
    overflow: hidden;
    text-overflow: ellipsis;

    font-weight: 550;
    letter-spacing: 0.005em;

  }
  .row-domain {
    margin-top: 3px;

    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--faint);
  }
  .row-cat { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .row-summary {
    display: none;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11.5px;
    line-height: 1.5;
    color: rgba(255,255,255,0.5);
  }  .cat-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
  .cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: var(--muted); }
  .row-time { text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .row-arrow { opacity: 0; color: var(--accent); transform: translateX(-3px); transition: opacity 0.16s ease, transform 0.16s ease; }
  .row-arrow svg { width: 14px; height: 14px; display: block; }
  .index-row:hover .row-arrow, .index-row.is-selected .row-arrow { opacity: 1; transform: translateX(0); }

  .empty {
    margin: 34px 0;
    padding: 54px 24px;
    border: 1px dashed var(--line-strong);
    border-radius: 12px;

  .empty strong { display: block; margin-bottom: 6px; font-family: var(--serif); font-size: 17px; font-weight: 500; color: var(--text); }
  .empty span { font-size: 10.5px; }
  .hidden { display: none !important; }

  /* ---------- 书脊视图 ---------- */
  #shelfView {
    position: relative;
    margin: 0 -28px;
    padding: 2px 28px 46px;
    background:
      radial-gradient(880px 320px at 50% -70px, rgba(216,166,87,0.1), transparent 72%),
      radial-gradient(130% 90% at 50% 38%, transparent 52%, rgba(0,0,0,0.42) 100%),
      radial-gradient(1200px 520px at 50% 118%, rgba(0,0,0,0.65), transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 132px),
      linear-gradient(180deg, #0a0a0b 0%, #070708 58%, #050506 100%);
  }
  .shelf-list { padding-top: 4px; }
  .shelf { margin: 20px 0 26px; }
  .shelf-head { display: flex; align-items: center; gap: 8px; padding: 0 2px 8px; }
  .shelf-dot { width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,255,255,0.03); }
  .shelf-title { font-size: 11px; font-weight: 600; color: #d6d2ca; letter-spacing: 0.02em; }
  .shelf-count { font-family: var(--mono); font-size: 8.5px; color: var(--faint); }
  .shelf-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .shelf-body {
    position: relative;
    padding: 14px 10px 0;
    border-radius: 3px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.022), transparent 42%),
      radial-gradient(120% 90% at 50% -30%, rgba(216,166,87,0.055), transparent 68%),
      linear-gradient(180deg, #0b0b0d 0%, #08080a 68%, #060607 100%);
    box-shadow:
      inset 0 12px 20px -14px rgba(0,0,0,0.95),
      inset 0 1px 0 rgba(255,255,255,0.035),
      inset 0 -1px 0 rgba(0,0,0,0.7);
  }
  .shelf-body::after {
    content: "";
    position: absolute;
    left: 6%;
    right: 6%;
    top: 0;
    height: 72%;
    background: radial-gradient(62% 100% at 50% 0%, rgba(216,166,87,0.06), transparent 72%);
    pointer-events: none;
  }
  .shelf-track {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    min-height: 176px;
    padding: 0 4px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  .shelf-track::-webkit-scrollbar { display: none; }
  .shelf-track.has-overflow {
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 calc(100% - 30px), transparent 100%);
    mask-image: linear-gradient(90deg, #000 0%, #000 calc(100% - 30px), transparent 100%);
  }
  .spine {
    --w: 30px;
    --tilt: 0deg;
    position: relative;
    flex: 0 0 var(--w);
    width: var(--w);
    height: var(--h, 128px);
    padding: 12px 0 14px;
    border-radius: 2px 2px 1px 1px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.01) 26%, rgba(0,0,0,0.16) 74%, rgba(0,0,0,0.34) 100%),
      linear-gradient(90deg, rgba(255,255,255,0.13) 0 1px, rgba(255,255,255,0.04) 1px 3px, transparent 3px calc(100% - 2px), rgba(0,0,0,0.55) 100%),
      linear-gradient(90deg, color-mix(in srgb, var(--tone) 32%, #171a1f) 0%, color-mix(in srgb, var(--tone) 17%, #101216) 48%, #0b0d10 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.11),
      inset 0 -2px 0 rgba(0,0,0,0.55),
      0 9px 15px -7px rgba(0,0,0,0.85);
    color: rgba(255,255,255,0.74);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    transform: rotate(var(--tilt));
    transform-origin: bottom center;
    transition: transform 0.22s cubic-bezier(0.22,1,0.36,1), box-shadow 0.22s ease, color 0.2s ease;
  }
  /* 书头布带 */
  .spine::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    right: 3px;
    height: 4px;
    border-radius: 1px;
    background: repeating-linear-gradient(90deg, var(--tone) 0 2px, rgba(255,255,255,0.3) 2px 4px);
    opacity: 0.28;
    pointer-events: none;
  }
  /* 书脚烫金细线 */
  .spine::after {
    content: "";
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 7px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(216,166,87,0.5), transparent);
    opacity: 0.55;
    pointer-events: none;
  }
  .spine:hover, .spine.is-selected {
    transform: translateY(-10px) rotate(calc(var(--tilt) - 0.5deg));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.2),
      inset 0 -2px 0 rgba(0,0,0,0.5),
      0 16px 24px -10px rgba(0,0,0,0.9),
      0 0 0 1px color-mix(in srgb, var(--tone) 55%, transparent);
    color: #fff;
  }
  .spine.is-selected::after {
    height: 2px;
    bottom: 6px;
    background: var(--accent);
    opacity: 0.95;
  }
  .spine-band {
    position: absolute;
    left: 4px;
    right: 4px;
    top: 19%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(216,166,87,0.55), transparent);
    opacity: 0.65;
    pointer-events: none;
  }
  .spine-title {
    max-height: calc(var(--h, 128px) - 30px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
    letter-spacing: 0.055em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.65);
  }
  .spine-mark {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    writing-mode: vertical-rl;
    font-family: var(--mono);
    font-size: 6.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--tone) 55%, #ffffff 20%);
    opacity: 0.42;
    max-height: 44px;
    overflow: hidden;
    pointer-events: none;
  }
  /* 书架板 */
  .shelf-board {
    position: relative;
    height: 14px;
    margin: 0 -10px;
    border-radius: 2px;
    background: linear-gradient(180deg, #2b2219 0%, #201a14 12%, #15100d 48%, #0d0a08 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,206,150,0.13),
      inset 0 -1px 0 rgba(0,0,0,0.85),
      0 14px 22px -8px rgba(0,0,0,0.9);
  }
  .shelf-board::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,205,150,0.2) 10%, rgba(255,205,150,0.16) 90%, transparent);
  }
  .shelf-board::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    top: 100%;
    height: 16px;
    background: radial-gradient(58% 100% at 50% 0%, rgba(0,0,0,0.6), transparent 72%);
    pointer-events: none;
  }
  .shelf-more {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: transparent;
    color: var(--faint);
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
  }
  .shelf-more:hover {
    border-color: rgba(216,166,87,0.42);
    background: rgba(216,166,87,0.08);
    color: var(--accent);
  }

  /* ---------- 索引卡 ---------- */
  .card-panel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: auto;
    z-index: 40;
    width: min(360px, calc(100vw - 36px));
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 24px;
    pointer-events: none;
  }
  /* 点开（固定）后，卡片改为停靠在右侧一列，把书架挤到左边，不再遮住任何书 */
  .card-panel.side-left {
    left: 0;
    right: auto;
    padding-left: 24px;
    padding-right: 0;
    justify-content: flex-start;
  }
  .card-panel.side-left .index-card { transform: translateY(12px) rotate(0.55deg); }
  .card-panel.side-left.is-visible .index-card { transform: translateY(0) rotate(0); }
  .card-panel.is-docked {
    position: relative;
    inset: auto;
    width: 100%;
    padding: 18px 20px 18px 0;
    align-items: flex-start;
    justify-content: flex-end;
    pointer-events: auto;
    border-left: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.012), transparent 38%);
  }
  .card-panel.is-docked .index-card {
    width: 100%;
    max-height: 100%;
    transform: translateY(0) rotate(0);
  }
  .card-panel.is-docked::after {
    content: "";
    position: absolute;
    left: -1px;
    top: 0;
    bottom: 0;
    width: 26px;
    background: linear-gradient(90deg, rgba(0,0,0,0.35), transparent);
    pointer-events: none;
  }
  .index-card {
    position: relative;
    width: 100%;
    max-height: calc(100dvh - 48px);
    overflow: auto;
    padding: 20px 20px 18px;
    border: 1px solid var(--card-line);
    border-radius: 14px;
    background:
      radial-gradient(120% 60% at 100% 0%, rgba(216,166,87,0.06), transparent 62%),
      linear-gradient(180deg, #191d23, #101317 72%);
    color: var(--card-ink);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.66),
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 0 0 1px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(12px) rotate(-0.55deg);
    transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.22,1,0.36,1);
    pointer-events: none;
  }
  .card-panel.is-visible .index-card { opacity: 1; transform: translateY(0) rotate(0); }
  /* 悬停预览纯展示，不拦鼠标；只有点开后停靠的卡片才可交互 */
  .card-panel.is-docked.is-visible .index-card { pointer-events: auto; }
  .index-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 14px;
    right: 14px;
    height: 2px;
    border-radius: 0 0 2px 2px;
    background: linear-gradient(90deg, rgba(216,166,87,0), #d8a657 18%, #f2d29a 50%, #d8a657 82%, rgba(216,166,87,0));
    box-shadow: 0 0 14px rgba(216,166,87,0.32);
  }
  .index-card::-webkit-scrollbar { width: 6px; }
  .index-card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }

  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card-kicker { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.2em; color: rgba(216,166,87,0.78); }
  .card-close {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    color: #8f959e;
    cursor: pointer;
    transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
